<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Raise Your Hand — enable camera</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 15px/1.5 -apple-system, system-ui, sans-serif; color: #e6edf3; background: #0d1117; }
    .card { max-width: 440px; padding: 32px; text-align: center; }
    .hand { font-size: 48px; }
    h1 { font-size: 20px; margin: 12px 0 6px; }
    p { color: #9aa4b2; margin: 6px 0 20px; }
    button { font: inherit; font-weight: 600; color: #fff; background: #1f6feb; border: none;
      border-radius: 8px; padding: 10px 20px; cursor: pointer; }
    button:hover { background: #388bfd; }
    .err { color: #f85149; margin-top: 16px; }
    .ok { color: #3fb950; }
  </style>
</head>
<body>
  <div class="card">
    <div class="hand">✋</div>
    <h1>Enable your camera</h1>
    <p>Raise Your Hand watches your webcam so you can raise your hand to ask a question — just like in class. Click <b>Allow</b> when Chrome asks. Nothing is recorded or uploaded.</p>
    <button id="grant">Enable camera</button>
    <div id="msg"></div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
